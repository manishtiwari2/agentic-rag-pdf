services:
  api:
    environment:
      RAG_OFFLINE: "1"
    depends_on: !override
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      prefetch-models: {condition: service_completed_successfully}

  worker:
    environment:
      RAG_OFFLINE: "1"

  prefetch-models:
    environment:
      RAG_OFFLINE: "1"

  ollama:
    profiles: [ollama]

  ollama-model:
    profiles: [ollama]
