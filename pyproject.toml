[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-pdf-rag"
version = "0.2.0"
description = "Local agentic RAG for PDF question answering, Phases 1-2"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pdfplumber>=0.11", "numpy>=1.24"]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2,<2.1", "alembic>=1.13,<2", "psycopg[binary]>=3.1,<4", "pgvector>=0.3,<1"]
api = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "argon2-cffi>=23,<26",
    "redis>=5,<6", "arq>=0.27,<1", "openai>=1.58,<3", "prometheus-client>=0.20,<1",
    "httpx>=0.27,<1", "pytesseract>=0.3.10",
    "jinja2>=3.1,<4",
]
faiss = ["faiss-cpu>=1.8"]
retrieval-models = [
    "torch>=2.1",
    "transformers>=4.44",
    "sentencepiece>=0.2",
]
models = [
    "agentic-pdf-rag[retrieval-models]",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
]
# The Colab notebook's OCR support (requirements-colab.txt, DD-067).
colab = ["pytesseract>=0.3.10"]
# pymupdf is AGPL-3.0 and test-only: it writes the fixture PDFs and serves
# as the second parser backend. See DD-033 and requirements-dev.txt.
dev = ["pytest>=8.0", "pymupdf>=1.24,<2", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
pymupdf = ["pymupdf>=1.24,<2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
